<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股操盘看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .time {
            font-size: 1.1em;
            color: #aaa;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,212,255,0.2);
        }
        .card-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7b2ff7);
            border-radius: 2px;
        }
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            transition: background 0.3s;
        }
        .stock-item:hover {
            background: rgba(0,0,0,0.3);
        }
        .stock-name {
            font-size: 1.1em;
            font-weight: 600;
        }
        .stock-code {
            font-size: 0.85em;
            color: #888;
            margin-top: 3px;
        }
        .stock-price {
            font-size: 1.4em;
            font-weight: bold;
        }
        .stock-change {
            font-size: 0.9em;
            margin-top: 3px;
        }
        .up { color: #ff4757; }
        .down { color: #2ed573; }
        .flat { color: #ffa502; }
        .market-index {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .index-item {
            text-align: center;
            padding: 15px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .index-name {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 8px;
        }
        .index-value {
            font-size: 1.3em;
            font-weight: bold;
        }
        .index-change {
            font-size: 0.85em;
            margin-top: 5px;
        }
        .etf-table {
            width: 100%;
            border-collapse: collapse;
        }
        .etf-table th {
            text-align: left;
            padding: 12px 10px;
            background: rgba(0,0,0,0.3);
            font-weight: 500;
            color: #00d4ff;
            font-size: 0.9em;
        }
        .etf-table td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .etf-table tr:hover td {
            background: rgba(255,255,255,0.03);
        }
        .sector-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .sector-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .sector-name {
            font-size: 0.95em;
        }
        .sector-change {
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .refresh-info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.85em;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .market-index {
                grid-template-columns: 1fr;
            }
            .sector-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📈 A股操盘看板</h1>
        <div class="time" id="currentTime"></div>
    </div>

    <div class="container">
        <!-- 持仓股票 -->
        <div class="card">
            <div class="card-title">持仓股票</div>
            <div id="holdings" class="loading">加载中</div>
        </div>

        <!-- 市场指数 -->
        <div class="card">
            <div class="card-title">市场指数</div>
            <div id="marketIndex" class="market-index loading">加载中</div>
        </div>

        <!-- ETF申赎 -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-title">ETF申赎情况</div>
            <div id="etfData" class="loading">加载中</div>
        </div>

        <!-- 板块行情 -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="card-title">热门板块</div>
            <div id="sectors" class="loading">加载中</div>
        </div>
    </div>

    <div class="refresh-info">
        数据每5秒自动刷新 | 数据来源：腾讯财经
    </div>

    <script>
        // 持仓股票列表
        const HOLDINGS = [
            { code: 'sz000063', name: '中兴通讯' },
            { code: 'sz002137', name: '实益达' }
        ];

        // 市场指数
        const INDICES = [
            { code: 'sh000001', name: '上证指数' },
            { code: 'sz399001', name: '深证成指' },
            { code: 'sz399006', name: '创业板指' }
        ];

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('currentTime').textContent = timeStr;
        }

        // 腾讯财经JSONP请求
        function fetchStockData(codes) {
            return new Promise((resolve) => {
                const callbackName = 'qqstock_' + Date.now();
                const script = document.createElement('script');
                const codeStr = codes.join(',');
                
                window[callbackName] = function(data) {
                    resolve(data);
                    delete window[callbackName];
                    document.body.removeChild(script);
                };

                // 使用腾讯股票接口
                script.src = `https://qt.gtimg.cn/q=${codeStr}&_callback=${callbackName}`;
                script.onerror = () => {
                    resolve(null);
                    delete window[callbackName];
                    document.body.removeChild(script);
                };
                document.body.appendChild(script);
            });
        }

        // 解析腾讯股票数据
        function parseStockData(data, code) {
            if (!data) return null;
            try {
                const parts = data.split('~');
                if (parts.length < 50) return null;
                return {
                    name: parts[1],
                    code: code,
                    price: parseFloat(parts[3]),
                    yesterday: parseFloat(parts[4]),
                    open: parseFloat(parts[5]),
                    volume: parseFloat(parts[6]),
                    change: parseFloat(parts[31]),
                    changePct: parseFloat(parts[32]),
                    high: parseFloat(parts[33]),
                    low: parseFloat(parts[34])
                };
            } catch (e) {
                return null;
            }
        }

        // 渲染持仓股票
        function renderHoldings(data) {
            const container = document.getElementById('holdings');
            let html = '';
            
            HOLDINGS.forEach((stock, idx) => {
                const d = data[idx];
                if (!d) return;
                
                const changeClass = d.changePct > 0 ? 'up' : d.changePct < 0 ? 'down' : 'flat';
                const changeSign = d.changePct > 0 ? '+' : '';
                
                html += `
                    <div class="stock-item">
                        <div>
                            <div class="stock-name">${d.name}</div>
                            <div class="stock-code">${stock.code}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="stock-price ${changeClass}">${d.price.toFixed(2)}</div>
                            <div class="stock-change ${changeClass}">${changeSign}${d.changePct.toFixed(2)}%</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html || '<div class="loading">暂无数据</div>';
        }

        // 渲染市场指数
        function renderIndices(data) {
            const container = document.getElementById('marketIndex');
            let html = '';
            
            INDICES.forEach((idx, i) => {
                const d = data[i];
                if (!d) return;
                
                const changeClass = d.changePct > 0 ? 'up' : d.changePct < 0 ? 'down' : 'flat';
                const changeSign = d.changePct > 0 ? '+' : '';
                
                html += `
                    <div class="index-item">
                        <div class="index-name">${d.name}</div>
                        <div class="index-value ${changeClass}">${d.price.toFixed(2)}</div>
                        <div class="index-change ${changeClass}">${changeSign}${d.changePct.toFixed(2)}%</div>
                    </div>
                `;
            });
            
            container.innerHTML = html || '<div class="loading">暂无数据</div>';
        }

        // 渲染ETF数据（模拟数据，实际应从API获取）
        function renderETF() {
            const container = document.getElementById('etfData');
            // 示例数据，实际应从云手机抓取的数据文件获取
            const etfData = [
                { name: '科创半导体ETF华夏', code: '588170', amount: '19.00亿', shares: '20.70亿', change: '+2.45%' },
                { name: '中证500ETF南方', code: '510500', amount: '15.01亿', shares: '2.00亿', change: '+2.24%' },
                { name: 'A500ETF华泰柏瑞', code: '563360', amount: '9.71亿', shares: '7.65亿', change: '+1.44%' },
                { name: '传媒ETF广发', code: '512980', amount: '4.84亿', shares: '5.74亿', change: '+6.92%' }
            ];
            
            let html = `
                <table class="etf-table">
                    <thead>
                        <tr>
                            <th>基金名称</th>
                            <th>增减金额</th>
                            <th>增减份额</th>
                            <th>涨幅</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            etfData.forEach(etf => {
                const changeClass = etf.change.startsWith('+') ? 'up' : etf.change.startsWith('-') ? 'down' : 'flat';
                html += `
                    <tr>
                        <td>${etf.name}<br><small style="color:#888">${etf.code}</small></td>
                        <td style="color:#00d4ff">${etf.amount}</td>
                        <td style="color:#00d4ff">${etf.shares}</td>
                        <td class="${changeClass}">${etf.change}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // 渲染板块数据（模拟数据）
        function renderSectors() {
            const container = document.getElementById('sectors');
            const sectors = [
                { name: 'AI视频', change: '+8.10%' },
                { name: 'AI应用', change: '+5.11%' },
                { name: '人工智能', change: '+3.85%' },
                { name: '半导体', change: '+2.96%' },
                { name: '消费电子', change: '+2.15%' },
                { name: '机器人', change: '+1.88%' }
            ];
            
            let html = '<div class="sector-list">';
            sectors.forEach(sector => {
                const changeClass = sector.change.startsWith('+') ? 'up' : 'down';
                html += `
                    <div class="sector-item">
                        <span class="sector-name">${sector.name}</span>
                        <span class="sector-change ${changeClass}">${sector.change}</span>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // 主数据加载函数
        async function loadData() {
            updateTime();
            
            try {
                // 获取持仓股票数据
                const holdingCodes = HOLDINGS.map(h => h.code);
                const stockData = await fetchStockData(holdingCodes);
                
                // 获取指数数据
                const indexCodes = INDICES.map(i => i.code);
                const indexData = await fetchStockData(indexCodes);
                
                if (stockData) {
                    const parsedStocks = HOLDINGS.map((h, i) => parseStockData(stockData, h.code));
                    renderHoldings(parsedStocks);
                }
                
                if (indexData) {
                    const parsedIndices = INDICES.map((i, idx) => parseStockData(indexData, i.code));
                    renderIndices(parsedIndices);
                }
                
                renderETF();
                renderSectors();
                
            } catch (error) {
                console.error('数据加载错误:', error);
            }
        }

        // 初始加载
        loadData();
        
        // 每5秒刷新
        setInterval(loadData, 5000);
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
